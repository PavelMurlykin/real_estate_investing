{% load static %}
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>RealtyFlow — инвестиции в недвижимость</title>
    <script>
      (function () {
        var storedTheme = localStorage.getItem('theme-preference');
        var systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';
        var theme = storedTheme === 'dark' || storedTheme === 'light'
          ? storedTheme
          : systemTheme;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="stylesheet" href="{% static 'react/app.css' %}">
  </head>
  <body>
    <div id="root"></div>
    <noscript>Для работы нового интерфейса необходимо включить JavaScript.</noscript>
    <script type="module" src="{% static 'react/app.js' %}"></script>
  </body>
</html>
